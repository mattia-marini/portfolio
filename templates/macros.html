{% component read_time(words) %}
    <span class="reading-time" title="Estimated read time">
      {% if words < 530 %}
        1 min read
      {% else %}
        {{ words / 265 | round }} min read
      {% endif %}
    </span>
{% endcomponent read_time %}
{% component gist(url: string, class: string = "") %}
<div {% if class %}class="{{class}}" {% endif %}>
  <script src="{{ url }}.js{% if file %}?file={{file}}{% endif %}"></script>
</div>
{% endcomponent gist %}
